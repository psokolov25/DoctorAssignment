<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="870" viewBox="0 0 1320 870" role="img" aria-labelledby="title desc">
  <title id="title">Последовательность назначения визита врачу</title>
  <desc id="desc">Пошаговая схема выбора услуги и очереди с опциональным обращением к med-robot.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
  <rect width="1320" height="870" fill="#F8FAFC"/>
  <style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#0F172A}.title{font-size:28px;font-weight:700}.step{font-size:15px;font-weight:700}.small{font-size:13px}.box{stroke-width:1.7;rx:14}.blue{fill:#E0F2FE;stroke:#0284C7}.green{fill:#DCFCE7;stroke:#16A34A}.violet{fill:#EDE9FE;stroke:#7C3AED}.amber{fill:#FEF3C7;stroke:#D97706}.rose{fill:#FFE4E6;stroke:#E11D48}.gray{fill:#F1F5F9;stroke:#64748B}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.bad{stroke:#E11D48;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <text class="title" x="40" y="48">Последовательность назначения визита врачу</text>
  <g transform="translate(60 95)">
    <rect class="box gray" x="0" y="0" width="310" height="92" rx="14"/><text class="step" x="155" y="28" text-anchor="middle">1. Событие Orchestra</text><text class="small" x="155" y="54" text-anchor="middle">посадка врача или смена профиля</text>
    <rect class="box blue" x="430" y="0" width="310" height="92" rx="14"/><text class="step" x="585" y="28" text-anchor="middle">2. Корреляция</text><text class="small" x="585" y="54" text-anchor="middle">дедупликация и DoctorContext</text>
    <rect class="box green" x="860" y="0" width="310" height="92" rx="14"/><text class="step" x="1015" y="28" text-anchor="middle">3. Кэш отделения</text><text class="small" x="1015" y="54" text-anchor="middle">справочники и runtime-состояние</text>
    <path class="line" d="M310 46 L430 46"/><path class="line" d="M740 46 L860 46"/>

    <rect class="box blue" x="0" y="165" width="310" height="105" rx="14"/><text class="step" x="155" y="195" text-anchor="middle">4. Очередь «врач не назначен»</text><text class="small" x="155" y="222" text-anchor="middle">чтение ожидающих визитов</text>
    <rect class="box blue" x="430" y="165" width="310" height="105" rx="14"/><text class="step" x="585" y="195" text-anchor="middle">5. Маршрут визита</text><text class="small" x="585" y="222" text-anchor="middle">непройденные услуги</text>
    <rect class="box amber" x="860" y="165" width="310" height="105" rx="14"/><text class="step" x="1015" y="195" text-anchor="middle">6. Локальный выбор</text><text class="small" x="1015" y="222" text-anchor="middle">предварительный serviceId</text>
    <path class="line" d="M1015 92 C1015 125 155 125 155 165"/><path class="line" d="M310 217 L430 217"/><path class="line" d="M740 217 L860 217"/>

    <rect class="box violet" x="0" y="345" width="310" height="118" rx="14"/><text class="step" x="155" y="377" text-anchor="middle">7. Запрос med-robot</text><text class="small" x="155" y="404" text-anchor="middle">набор непройденных услуг</text><text class="small" x="155" y="425" text-anchor="middle">[301, 302, 303]</text>
    <rect class="box violet" x="430" y="345" width="310" height="118" rx="14"/><text class="step" x="585" y="377" text-anchor="middle">8. Проверка ответа</text><text class="small" x="585" y="404" text-anchor="middle">услуга в маршруте, очередь известна</text><text class="small" x="585" y="425" text-anchor="middle">строгий режим — услуга доступна врачу</text>
    <rect class="box rose" x="860" y="345" width="310" height="118" rx="14"/><text class="step" x="1015" y="377" text-anchor="middle">9. Возврат к локальному алгоритму</text><text class="small" x="1015" y="404" text-anchor="middle">при ошибке или недопустимой паре</text>
    <path class="line" d="M1015 270 C1015 320 155 305 155 345"/><path class="line" d="M310 404 L430 404"/><path class="bad" d="M740 404 L860 404"/>

    <rect class="box green" x="215" y="540" width="360" height="112" rx="14"/><text class="step" x="395" y="572" text-anchor="middle">10. Исполнение решения</text><text class="small" x="395" y="600" text-anchor="middle">assign-service при необходимости</text><text class="small" x="395" y="621" text-anchor="middle">transfer-visit в целевую очередь</text>
    <rect class="box gray" x="725" y="540" width="360" height="112" rx="14"/><text class="step" x="905" y="572" text-anchor="middle">11. Завершение цикла</text><text class="small" x="905" y="600" text-anchor="middle">фиксируется результат</text><text class="small" x="905" y="621" text-anchor="middle">следующий визит обрабатывается отдельно</text>
    <path class="line" d="M585 463 C585 505 395 505 395 540"/><path class="line" d="M1015 463 C1015 510 395 500 395 540"/><path class="line" d="M575 596 L725 596"/>
  </g>
</svg>
