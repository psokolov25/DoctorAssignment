<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="660" viewBox="0 0 1250 660" role="img" aria-labelledby="title desc">
  <title id="title">Схема внедрения и эксплуатации</title>
  <desc id="desc">Схема сетевых зависимостей Doctor Assistant при внедрении.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
  <rect width="1250" height="660" fill="#F8FAFC"/>
  <style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#0F172A}.title{font-size:28px;font-weight:700}.groupTitle{font-size:17px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:13px}.group{fill:#fff;stroke:#CBD5E1;stroke-width:1.6}.box{stroke-width:1.7;rx:14}.blue{fill:#E0F2FE;stroke:#0284C7}.violet{fill:#EDE9FE;stroke:#7C3AED}.amber{fill:#FEF3C7;stroke:#D97706}.gray{fill:#F1F5F9;stroke:#64748B}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <text class="title" x="40" y="48">Схема внедрения и эксплуатации</text>
  <rect class="group" x="55" y="105" width="360" height="430" rx="18"/><text class="groupTitle" x="85" y="137">Сервер приложения</text>
  <rect class="box blue" x="95" y="185" width="280" height="135" rx="14"/><text class="label" x="235" y="220" text-anchor="middle">Doctor Assistant</text><text class="small" x="235" y="248" text-anchor="middle">med-doctor-assignment-service</text><text class="small" x="235" y="270" text-anchor="middle">JVM 8, Micronaut, Netty</text>
  <rect class="box amber" x="95" y="375" width="280" height="105" rx="14"/><text class="label" x="235" y="405" text-anchor="middle">Файловые логи</text><text class="small" x="235" y="431" text-anchor="middle">med-robot*.log</text><text class="small" x="235" y="452" text-anchor="middle">диагностика и разбор инцидентов</text>
  <rect class="group" x="505" y="105" width="310" height="430" rx="18"/><text class="groupTitle" x="535" y="137">QMatic Orchestra 6</text>
  <rect class="box gray" x="545" y="185" width="230" height="105" rx="14"/><text class="label" x="660" y="218" text-anchor="middle">REST API</text><text class="small" x="660" y="245" text-anchor="middle">справочники и визиты</text>
  <rect class="box gray" x="545" y="365" width="230" height="105" rx="14"/><text class="label" x="660" y="398" text-anchor="middle">qpevents/events</text><text class="small" x="660" y="425" text-anchor="middle">SockJS / STOMP</text>
  <rect class="group" x="900" y="105" width="290" height="430" rx="18"/><text class="groupTitle" x="930" y="137">med-robot</text>
  <rect class="box violet" x="940" y="245" width="210" height="125" rx="14"/><text class="label" x="1045" y="280" text-anchor="middle">REST API выбора</text><text class="small" x="1045" y="307" text-anchor="middle">оптимальная услуга</text><text class="small" x="1045" y="328" text-anchor="middle">и целевая очередь</text>
  <ellipse cx="660" cy="590" rx="105" ry="35" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/><text class="label" x="660" y="596" text-anchor="middle">DevOps / поддержка</text>
  <path class="line" d="M375 238 L545 238"/><text class="small" x="460" y="224" text-anchor="middle">справочники и мутации</text>
  <path class="line" d="M545 417 L375 270"/><text class="small" x="460" y="370" text-anchor="middle">события и heartbeat</text>
  <path class="line" d="M375 252 C555 145 810 160 940 300"/><text class="small" x="670" y="166" text-anchor="middle">опциональный запрос</text>
  <path class="line" d="M235 320 L235 375"/><text class="small" x="285" y="354">запись логов</text>
  <path class="line" d="M625 558 L310 480"/><text class="small" x="485" y="535">анализ</text>
  <path class="line" d="M645 558 L275 320"/><text class="small" x="470" y="470">настройка</text>
</svg>
