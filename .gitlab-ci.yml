stages:
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

build_jar:
  stage: build
  image: maven:3.9.9-eclipse-temurin-8
  before_script:
    - |
      ensure_java8() {
        if java -version 2>&1 | head -n 1 | grep -q '"1\.8\.'; then
          return 0
        fi

        mkdir -p .ci-tools
        JDK_ARCHIVE=".ci-tools/jdk8.tar.gz"
        JDK_DIR=".ci-tools/jdk8"
        JDK_URL="https://github.com/adoptium/temurin8-binaries/releases/latest/download/OpenJDK8U-jdk_x64_linux_hotspot_8u472b08.tar.gz"

        if [ ! -f "$JDK_ARCHIVE" ]; then
          curl -fsSL "$JDK_URL" -o "$JDK_ARCHIVE"
        fi

        rm -rf "$JDK_DIR"
        mkdir -p "$JDK_DIR"
        tar -xzf "$JDK_ARCHIVE" -C "$JDK_DIR" --strip-components=1
        export JAVA_HOME="$PWD/$JDK_DIR"
        export PATH="$JAVA_HOME/bin:$PATH"
      }

      ensure_java8
    - java -version
  script:
    - chmod +x ./mvnw
    - ./mvnw $MAVEN_CLI_OPTS clean package
  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 7 days
    paths:
      - target/*.jar
    when: on_success
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
