micronaut:
  server:
    # Порт HTTP-сервера самого сервиса.
    # На этом порту будут доступны management endpoint-ы Micronaut и возможные будущие REST endpoint-ы сервиса.
    port: 8085
  http:
    client:
      # Таймаут чтения ответа от Orchestra.
      # Имеет смысл увеличивать, если REST Orchestra отвечает медленно или находится за медленным reverse proxy.
      read-timeout: 60000ms

application:
  orchestra:
    # Базовый URL Orchestra без завершающего слэша.
    # Используется и для REST, и для SockJS/STOMP-подключения к /qpevents/events.
    url: http://192.168.7.135:8080

    # Сервисная учетная запись Orchestra.
    # Для production рекомендуется вынести в переменные окружения / секреты.
    username: superadmin
    password: 11November2024

    # Общий REST base path Orchestra.
    # По умолчанию для подтвержденных endpoint-ов используется /rest.
    common-rest-path: /rest

    # Base path configuration API Orchestra.
    configuration-rest-path: /qsystem/rest/config

    # Какие отделения нужно прогревать и поддерживать в кэше.
    # Возможные варианты:
    #   "*"   -> все доступные отделения
    #   "6"   -> одно отделение
    #   "6,7" -> несколько отделений через запятую
    branches-for-cache: "1"

    # Повторно отправлять ли cookie, полученные на mutating REST-операциях.
    # По свежим логам Orchestra первый PUT без cookie проходит, а последующие PUT с mutation-cookie
    # массово получают 403, поэтому по умолчанию replay выключен.
    replay-mutation-cookies: false

    # Если Orchestra недоступна на старте или во время refresh branch cache,
    # сервис не завершается аварийно, а планирует повторную попытку bootstrap/refresh.
    reconnect-delay-ms: 30000

  med-robot:
    # Включает обращение к med-robot для выбора оптимальной услуги и очереди.
    # false — полностью старая локальная схема Doctor Assistant.
    enabled: true

    # Базовый URL REST API med-robot.
    url: http://192.168.7.135:8082

    # Контракт из med-robot: POST /prorobot/optimalqueue/{branchId}/service/{serviceId}
    # Тело запроса — JSON-массив id непройденных услуг визита.
    optimal-service-path: /prorobot/optimalqueue/{branchId}/service/{serviceId}

    # Для текущего Orchestra в очереди "Врач не назначен" unservedVisitServices часто пустой.
    # Поэтому med-robot должен вызываться по номеру талона в text/plain, а не по JSON-массиву услуг.
    request-body-mode: TICKET_NUMBER_PLAIN_TEXT
    plain-text-policy: default
    error-handling-mode: FALLBACK_TO_LOCAL

    # Опциональная Basic Auth для закрытого REST API med-robot.
    # username: robot
    # password: secret

    # При ошибке med-robot не останавливать цикл, а использовать локальный алгоритм.
    fallback-to-local-on-error: true

    # Если med-robot вернул null/null или 0/0, использовать локальный алгоритм.
    fallback-to-local-on-empty-response: true

    # true — принимать только услуги, доступные текущему врачу;
    # false — доверять med-robot как оптимизатору очереди в масштабе отделения.
    require-doctor-available-service: false

    # Проверять, что очередь, возвращенная med-robot, присутствует в кэше отделения.
    require-known-queue: true

  websocket:
    # Включает event-driven режим через SockJS/STOMP.
    # Если false, сервис будет работать только через polling fallback.
    enabled: false

    # Базовый STOMP topic, под которым Orchestra публикует события.
    # Подписка формируется как <topic>/<eventName>/*.
    topic: /topic/event

    # Список событий Orchestra, которые нужны для безопасной корреляции посадки.
    # USER_SERVICE_POINT_SESSION_START открывает pending-session,
    # а следующий SET_WORK_PROFILE той же посадки завершает стабилизацию профиля.
    subscribed-events:
      - USER_SERVICE_POINT_SESSION_START
      - SET_WORK_PROFILE

    # Задержка перед попыткой переподключения websocket, если канал был потерян.
    delay-before-reconnect-in-milliseconds: 10000

    # Передавать ли REST cookie в websocket/SockJS handshake.
    # По умолчанию выключено: websocket авторизуется только через Authorization header,
    # а cookie используются только в обычных REST API запросах.
    send-cookies-in-handshake: false

  assignment:
    # Глобальный флаг включения алгоритма назначения.
    enabled: true

    # Идентификатор очереди "врач не назначен".
    # Это queue id Orchestra, из которой сервис берет визиты для перераспределения.
    unknown-doctor-queue-id: 292

    # Максимальное количество визитов, обрабатываемых за один цикл.
    # Нужен как предохранитель от слишком длинной обработки одного события.
    max-visits-per-cycle: 50

    # Включает периодическую reconciliation-задачу.
    # Для режима только по событиям установите false.
    # Для режима только по расписанию оставьте true и выключите application.websocket.enabled.
    polling-enabled: true

    # Cron для fallback polling.
    # Даже при включенном websocket эта задача полезна как страховка от потерянных событий.
    polling-cron: "0 */1 * * * ?"

    # Максимальное время ожидания branch-level lock.
    # Если отделение уже обрабатывается другим потоком, текущий цикл будет пропущен.
    branch-lock-timeout-ms: 5000

    # Режим без реальных изменений в Orchestra.
    # При true сервис только пишет в лог, какие действия он бы выполнил.
    dry-run: false

    # Разрешает ли SERVICE_POINT_OPEN запускать mutating workflow.
    # По логам Orchestra этот сигнал часто преждевременный, поэтому по умолчанию выключен.
    service-point-open-trigger-enabled: false

    # Разрешает ли SET_WORK_PROFILE запускать mutating workflow как самостоятельный raw-trigger.
    # По умолчанию выключено: этот сигнал используется как вторая половина корреляции посадки.
    set-work-profile-trigger-enabled: false

    # Разрешает ли SET_WORK_PROFILE внутри уже активной сессии врача запускать повторный цикл,
    # если новый рабочий профиль расширяет доступный набор услуг.
    work-profile-expanded-trigger-enabled: true

    # Разрешает ли цепочке USER_SERVICE_POINT_SESSION_START -> SET_WORK_PROFILE запускать mutating workflow.
    # Это основной рекомендуемый trigger для реального назначения и перевода визитов.
    user-service-point-session-start-trigger-enabled: true

    # Окно ожидания финального SET_WORK_PROFILE после USER_SERVICE_POINT_SESSION_START.
    # По наблюдаемым логам профиль стабилизируется за десятки миллисекунд,
    # поэтому по умолчанию достаточно короткого окна.
    user-session-settle-window-ms: 2000

    # Перед переводом визита перечитать его и убедиться, что он все еще находится в очереди "врач не назначен".
    recheck-visit-before-transfer: true

    # После первого 403/контекстного отказа на mutating REST не продолжать цикл по оставшимся визитам.
    # Это уменьшает шум в логах и не долбит Orchestra повторными заведомо неверными PUT.
    abort-cycle-on-forbidden-mutation: true

    # Если assign-service вернул userState=INACTIVE, считать такой ответ контекстной ошибкой
    # и не переходить к transfer в том же цикле.
    treat-inactive-user-state-as-failure: true

    # Если assign-service вернул userState=NO_STARTED_SERVICE_POINT_SESSION, считать такой ответ
    # контекстной ошибкой того же класса, что и INACTIVE, и завершать текущий цикл раньше.
    treat-no-started-service-point-session-as-failure: true

    # Опциональный отдельный activation-step перед assign/transfer.
    # Нужен для тех инсталляций Orchestra, где перед мутациями требуется явный REST-вызов,
    # запускающий или привязывающий server-side session рабочего места/оператора.
    activation:
      # По умолчанию выключено, потому что точный REST-контракт activation endpoint-а пока не подтвержден.
      enabled: false

      # Если activation-step вернул 4xx/5xx или тело с userState=INACTIVE / NO_STARTED_SERVICE_POINT_SESSION,
      # завершать текущий цикл до первой мутации.
      fail-cycle-on-error: true

      # HTTP-метод activation вызова. Поддерживаются GET/POST/PUT/PATCH/DELETE.
      method: POST

      # Путь activation endpoint-а. Может содержать placeholders:
      # {branchId}, {servicePointId}, {staffId}, {workProfileId}, {servicePointName}, {workProfileName}, {userName}
      path: ""

      # Тело activation-запроса как шаблон строки с теми же placeholders.
      # Пример:
      # payload-template: '{"branchId":{branchId},"servicePointId":{servicePointId},"staffId":{staffId},"workProfileId":{workProfileId}}'
      payload-template: ""

    # Белый список branch id, на которых разрешено реальное выполнение алгоритма.
    # Пустой список означает "разрешены все".
    allowed-branches: [ 1 ]

    # TTL branch cache в секундах.
    # Если кэш старше этого значения, перед обработкой события он будет перестроен.
    stale-cache-duration-seconds: 300

    # Окно дедупликации входящих событий Orchestra.
    # Повтор с тем же вычисленным ключом внутри этого окна будет проигнорирован.
    event-deduplication-ttl-seconds: 120

    # Окно защиты от повторной обработки одного и того же визита одним и тем же врачом.
    processed-visit-ttl-seconds: 900

    # Опциональная карта приоритетов услуг.
    # Ключом может быть serviceId, internalName или externalName услуги.
    # Используется, когда routeOrder не задает однозначного выбора.
    # Пример:
    # service-priority-by-key:
    #   "4": 10
    #   "THERAPIST": 5
    service-priority-by-key: { }

    # Резервный source entry point id для отделений, у которых нет собственного значения.
    # Нужен, если Orchestra в поле fromId endpoint-а перевода ожидает именно entry point id.
    # default-source-entry-point-id: 1

    # Source entry point id по отделениям.
    # Ключ — branch id, значение — соответствующий entry point id в конкретном отделении.
    # Пример:
    # source-entry-point-id-by-branch:
    #   6: 1
    #   7: 3
    source-entry-point-id-by-branch:
      1: 1

    experimental-endpoints:
      # Флаг включения visit workflow adapter-а.
      # Если false, любые попытки работать с визитами через ConfigurableVisitWorkflowGateway завершатся ошибкой конфигурации.
      enabled: true

      # Endpoint чтения полного списка визитов очереди.
      # Должен возвращать массив VisitSummary-совместимых объектов.
      queue-visits-path: "/rest/entrypoint/branches/{branchId}/queues/{queueId}/visits/full/"

      # Endpoint чтения детального состояния визита.
      # Используется для анализа маршрута и непройденных услуг.
      visit-details-path: "/rest/entrypoint/branches/{branchId}/visits/{visitId}/"

      # Endpoint повторного чтения визита по id.
      # Нужен для defensive recheck перед переводом и для post-check результата.
      visit-by-id-path: "/rest/entrypoint/branches/{branchId}/visits/{visitId}/"

      # Endpoint назначения услуги визиту.
      # На текущей проверенной интеграции вызывается как PUT по URL ресурса,
      # без обязательного payload в теле запроса.
      assign-service-path: "/rest/entrypoint/branches/{branchId}/visits/{visitId}/services/{serviceId}/"

      # Endpoint перевода визита в очередь.
      # Важно: тело запроса содержит fromBranchId, fromId и visitId.
      # fromId в текущей реализации — это source entry point id,
      # который задается через default-source-entry-point-id или source-entry-point-id-by-branch.
      transfer-visit-path: "/rest/entrypoint/branches/{branchId}/queues/{queueId}/visits/"
