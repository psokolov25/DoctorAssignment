<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Общая архитектура Doctor Assistant и med-robot</title>
  <desc id="desc">Русскоязычная схема взаимодействия Doctor Assistant, QMatic Orchestra 6 и med-robot.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1400" height="780" fill="#F8FAFC"/>
  <style>
    text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#0F172A}.title{font-size:28px;font-weight:700}.groupTitle{font-size:17px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:13px}.tiny{font-size:12px}.group{fill:#fff;stroke:#CBD5E1;stroke-width:1.6}.blue{fill:#E0F2FE;stroke:#0284C7}.green{fill:#DCFCE7;stroke:#16A34A}.violet{fill:#EDE9FE;stroke:#7C3AED}.amber{fill:#FEF3C7;stroke:#D97706}.rose{fill:#FFE4E6;stroke:#E11D48}.gray{fill:#F1F5F9;stroke:#64748B}.card{stroke-width:1.6;filter:url(#cardShadow)}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.note{font-size:13px;fill:#475569}
  </style>
  <text class="title" x="40" y="48">Общая архитектура Doctor Assistant и med-robot</text>
  <text class="note" x="40" y="75">Пояснения на русском языке; программные имена оставлены только для сопоставления с исходным кодом.</text>

  <rect class="group" x="35" y="105" width="320" height="555" rx="18"/>
  <text class="groupTitle" x="60" y="137">QMatic Orchestra 6</text>
  <rect class="card gray" x="70" y="165" width="250" height="105" rx="14"/>
  <text class="label" x="195" y="193" text-anchor="middle">События рабочих мест</text>
  <text class="small" x="195" y="217" text-anchor="middle">SockJS / STOMP</text>
  <text class="tiny" x="195" y="239" text-anchor="middle">USER_SERVICE_POINT_SESSION_START</text>
  <text class="tiny" x="195" y="257" text-anchor="middle">SET_WORK_PROFILE</text>
  <rect class="card gray" x="70" y="330" width="250" height="105" rx="14"/>
  <text class="label" x="195" y="360" text-anchor="middle">REST API Orchestra</text>
  <text class="small" x="195" y="385" text-anchor="middle">справочники, визиты, очереди</text>
  <text class="small" x="195" y="407" text-anchor="middle">операции назначения и перевода</text>

  <rect class="group" x="430" y="105" width="565" height="555" rx="18"/>
  <text class="groupTitle" x="455" y="137">Doctor Assistant · med-doctor-assignment-service</text>
  <rect class="card blue" x="465" y="165" width="225" height="95" rx="14"/>
  <text class="label" x="577" y="194" text-anchor="middle">Прием событий</text>
  <text class="small" x="577" y="218" text-anchor="middle">WebSocketService</text>
  <text class="small" x="577" y="238" text-anchor="middle">StompSessionHandlerImpl</text>
  <rect class="card blue" x="735" y="165" width="225" height="95" rx="14"/>
  <text class="label" x="847" y="194" text-anchor="middle">Корреляция посадки</text>
  <text class="small" x="847" y="218" text-anchor="middle">DoctorAssignmentEventHandler</text>
  <text class="small" x="847" y="238" text-anchor="middle">дедупликация событий</text>
  <rect class="card amber" x="465" y="315" width="225" height="95" rx="14"/>
  <text class="label" x="577" y="344" text-anchor="middle">Опрос по расписанию</text>
  <text class="small" x="577" y="368" text-anchor="middle">PollingReconciliationJob</text>
  <text class="small" x="577" y="388" text-anchor="middle">страховка от потери событий</text>
  <rect class="card green" x="735" y="315" width="225" height="95" rx="14"/>
  <text class="label" x="847" y="344" text-anchor="middle">Кэш отделения</text>
  <text class="small" x="847" y="368" text-anchor="middle">BranchAssignmentCache</text>
  <text class="small" x="847" y="388" text-anchor="middle">атомарная замена</text>
  <rect class="card blue" x="465" y="470" width="225" height="105" rx="14"/>
  <text class="label" x="577" y="499" text-anchor="middle">Доменный цикл</text>
  <text class="small" x="577" y="523" text-anchor="middle">AutonomousMedicalExam</text>
  <text class="small" x="577" y="543" text-anchor="middle">AssignmentService</text>
  <rect class="card violet" x="735" y="470" width="225" height="105" rx="14"/>
  <text class="label" x="847" y="499" text-anchor="middle">Выбор услуги</text>
  <text class="small" x="847" y="523" text-anchor="middle">локальный алгоритм</text>
  <text class="small" x="847" y="543" text-anchor="middle">+ med-robot</text>

  <rect class="group" x="1070" y="105" width="295" height="555" rx="18"/>
  <text class="groupTitle" x="1095" y="137">Внешняя оптимизация</text>
  <rect class="card violet" x="1105" y="200" width="225" height="115" rx="14"/>
  <text class="label" x="1217" y="230" text-anchor="middle">med-robot</text>
  <text class="small" x="1217" y="254" text-anchor="middle">оптимальная услуга</text>
  <text class="small" x="1217" y="274" text-anchor="middle">и целевая очередь</text>
  <rect class="card rose" x="1105" y="420" width="225" height="105" rx="14"/>
  <text class="label" x="1217" y="449" text-anchor="middle">Мутации визита</text>
  <text class="small" x="1217" y="473" text-anchor="middle">ConfigurableVisit</text>
  <text class="small" x="1217" y="493" text-anchor="middle">WorkflowGateway</text>

  <path class="line" d="M320 215 C380 215 405 212 465 212"/><text class="tiny" x="392" y="198">события</text>
  <path class="line" d="M690 212 L735 212"/>
  <path class="line" d="M577 260 L577 315"/>
  <path class="line" d="M847 260 L847 315"/>
  <path class="line" d="M690 522 L735 522"/><text class="tiny" x="705" y="508">решение</text>
  <path class="line" d="M960 522 C1030 522 1030 258 1105 258"/><text class="tiny" x="1015" y="382">опционально</text>
  <path class="line" d="M1105 475 C1040 475 1030 560 960 560"/><text class="tiny" x="1010" y="540">serviceId / queueId</text>
  <path class="line" d="M577 410 L577 470"/>
  <path class="line" d="M847 410 C847 438 750 450 690 500"/>
  <path class="line" d="M465 540 C395 540 380 382 320 382"/><text class="tiny" x="360" y="482">REST-мутации</text>
  <path class="line dash" d="M735 350 C620 350 475 380 320 382"/><text class="tiny" x="510" y="338">чтение справочников</text>
</svg>
