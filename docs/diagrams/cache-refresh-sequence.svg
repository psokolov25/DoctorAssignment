<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Пересборка кэша отделения</title>
  <desc id="desc">Схема атомарной пересборки BranchAssignmentCache.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="650" fill="#F8FAFC"/>
  <style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#0F172A}.title{font-size:28px;font-weight:700}.step{font-size:15px;font-weight:700}.small{font-size:13px}.box{stroke-width:1.7;rx:14}.blue{fill:#E0F2FE;stroke:#0284C7}.green{fill:#DCFCE7;stroke:#16A34A}.amber{fill:#FEF3C7;stroke:#D97706}.gray{fill:#F1F5F9;stroke:#64748B}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <text class="title" x="40" y="48">Пересборка кэша отделения</text>
  <text class="small" x="40" y="78">Кэш не обновляется частями: сначала строится новый объект, затем активная ссылка заменяется атомарно.</text>
  <rect class="box gray" x="70" y="125" width="250" height="95" rx="14"/><text class="step" x="195" y="155" text-anchor="middle">1. Старт обновления</text><text class="small" x="195" y="183" text-anchor="middle">запуск сервиса или расписание</text>
  <rect class="box blue" x="475" y="125" width="250" height="95" rx="14"/><text class="step" x="600" y="155" text-anchor="middle">2. Обход отделений</text><text class="small" x="600" y="183" text-anchor="middle">OrchestraDataCacheUpdateService</text>
  <rect class="box blue" x="880" y="125" width="250" height="95" rx="14"/><text class="step" x="1005" y="155" text-anchor="middle">3. Чтение справочников</text><text class="small" x="1005" y="183" text-anchor="middle">услуги, очереди, профили</text>
  <path class="line" d="M320 172 L475 172"/><path class="line" d="M725 172 L880 172"/>
  <rect class="box green" x="165" y="350" width="280" height="105" rx="14"/><text class="step" x="305" y="382" text-anchor="middle">4. Новый BranchAssignmentCache</text><text class="small" x="305" y="410" text-anchor="middle">согласованный справочный срез</text>
  <rect class="box green" x="535" y="350" width="280" height="105" rx="14"/><text class="step" x="675" y="382" text-anchor="middle">5. Атомарная замена</text><text class="small" x="675" y="410" text-anchor="middle">OrchestraDataCacheContainer</text>
  <rect class="box amber" x="905" y="350" width="250" height="105" rx="14"/><text class="step" x="1030" y="382" text-anchor="middle">6. Готовность к событиям</text><text class="small" x="1030" y="410" text-anchor="middle">нет «полусобранного» кэша</text>
  <path class="line" d="M1005 220 C1005 295 305 285 305 350"/><path class="line" d="M445 402 L535 402"/><path class="line" d="M815 402 L905 402"/>
</svg>
